name: 发版

on:
  push:
    branches: [main]
  workflow_dispatch:

# 默认不给任何权限，每个任务只拿自己要用的。
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 安装 pnpm
        run: npm install --global pnpm@12.15.0
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 前端检查
        run: pnpm check
      - name: 构建管理页面
        run: pnpm build:web
      - name: 构建文档站
        run: pnpm build:docs
      - name: 后端测试
        run: |
          dotnet test tests/Ntm.Protocol.Tests
          dotnet test tests/Ntm.Gateway.Tests
          dotnet test tests/Ntm.Server.Tests

  image:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      # 推 Docker Hub 只要读代码；write 是给最后一步改发版说明用的。
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: gohopo/ntm
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
      - name: 在发版说明末尾写上镜像
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          printf '\n### 镜像\n\n```sh\ndocker pull gohopo/ntm:%s\n```\n' "$VERSION" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
